<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Estúdio Amor que Cuida</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SISTEMA DE ALERTAS E CONFIRMAÇÕES CUSTOMIZADOS -->
    <div id="toast-container"></div>
    <div id="custom-confirm" class="overlay hidden">
        <div class="modal" style="max-width: 400px; text-align: center;">
            <h3 id="confirm-title" style="margin-bottom: 1rem;">Atenção</h3>
            <p id="confirm-msg" style="margin-bottom: 2rem; color: var(--muted);"></p>
            <div style="display: flex; gap: 10px;">
                <button class="btn-secondary" id="confirm-cancel">Cancelar</button>
                <button class="btn-primary" id="confirm-ok">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- CAMADA DE AUTENTICAÇÃO -->
    <div id="auth-layer" class="auth-layer active">
        <section id="login-screen" class="screen active">
            <div class="login-card">
                <i class="ph ph-lock-key text-primary" style="font-size: 2.5rem; margin-bottom: 1rem;"></i>
                <h2>Acesso ao Sistema</h2>
                <form id="login-form">
                    <div class="input-group"><label>Usuário</label><input type="text" id="username" required></div>
                    <div class="input-group"><label>Senha</label><input type="password" id="password" required></div>
                    <button type="submit" class="btn-primary" id="btn-login">Entrar</button>
                </form>
            </div>
        </section>
    </div>

    <!-- ESTRUTURA PRINCIPAL -->
    <div id="system-layout" class="hidden">
        
        <aside class="sidebar" id="main-sidebar">
            <div class="sidebar-brand">
                <i class="ph ph-scissors"></i><span id="brand-name">Amor que Cuida</span>
                <button class="close-sidebar mobile-only" onclick="Nav.closeMenu()"><i class="ph ph-x"></i></button>
            </div>
            <nav class="sidebar-nav content-scroll">
                <div class="nav-section">PRINCIPAL</div>
                <a href="#" class="nav-link active" data-view="agenda"><i class="ph ph-calendar"></i> Agenda</a>
                <a href="#" class="nav-link" data-view="comandas"><i class="ph ph-receipt"></i> Comandas</a>
                <a href="#" class="nav-link" data-view="cobrancas"><i class="ph ph-credit-card"></i> Cobranças</a>
                
                <div class="nav-section">CADASTROS</div>
                <a href="#" class="nav-link" data-view="clientes"><i class="ph ph-users"></i> Clientes</a>
                <a href="#" class="nav-link owner-only" data-view="servicos"><i class="ph ph-sparkle"></i> Serviços</a>
                <a href="#" class="nav-link owner-only" data-view="produtos"><i class="ph ph-package"></i> Produtos</a>
                
                <div class="nav-section owner-only">GESTÃO & INTELIGÊNCIA</div>
                <a href="#" class="nav-link owner-only" data-view="despesas"><i class="ph ph-trend-down"></i> Despesas</a>
                <a href="#" class="nav-link owner-only" data-view="mensagens"><i class="ph ph-chat-circle-text"></i> Mensagens</a>
                <a href="#" class="nav-link" data-view="comissao"><i class="ph ph-money"></i> Comissão</a>
                <a href="#" class="nav-link owner-only" data-view="resumo-financeiro"><i class="ph ph-bank"></i> Financeiro</a>
                <a href="#" class="nav-link owner-only" data-view="performance"><i class="ph ph-chart-line-up"></i> Performance</a>
                
                <div class="spacer" style="margin-top: 2rem;"></div>
                <a href="#" class="nav-link owner-only" data-view="configuracoes"><i class="ph ph-gear"></i> Configurações</a>
                <a href="#" class="nav-link logout" onclick="Auth.logout()"><i class="ph ph-sign-out"></i> Sair</a>
            </nav>
        </aside>

        <div id="mobile-overlay" class="overlay hidden" onclick="Nav.closeMenu()"></div>

        <main class="main-content">
            <header class="top-bar">
                <h1 id="page-title">Agenda</h1>
                <!-- Botão Adicionar para Desktop -->
                <button class="btn-primary desktop-only" style="width: auto; padding: 0.6rem 1.5rem; margin-right: 15px;" onclick="UI.handleFabClick()">+ Adicionar / Novo</button>
                <div class="user-pill"><span id="header-user">Usuário</span><div class="avatar" id="header-avatar">US</div></div>
            </header>

            <div class="views-container">
                <section id="view-agenda" class="view active">
                    <div class="ios-calendar">
                        <div class="cal-header"><button onclick="Render.changeWeek(-1)"><i class="ph ph-caret-left"></i></button><h3 id="cal-month-year">...</h3><button onclick="Render.changeWeek(1)"><i class="ph ph-caret-right"></i></button></div>
                        <div class="cal-days" id="cal-days-row"></div>
                    </div>
                    <div id="agenda-list" class="data-list"></div>
                </section>
                
                <!-- Demais Containers (Preenchidos pelo JS Realtime) -->
                <section id="view-cobrancas" class="view"><div id="cobrancas-list" class="data-list"></div></section>
                <section id="view-comandas" class="view"><div id="comandas-list" class="data-grid"></div></section>
                <section id="view-clientes" class="view"><div id="clientes-list" class="data-grid"></div></section>
                <section id="view-anamnese" class="view">
                    <div class="header-actions" style="display:flex; gap:15px; margin-bottom:2rem;">
                        <button class="btn-secondary" onclick="Nav.showView('clientes')" style="width: auto;"><i class="ph ph-arrow-left"></i> Voltar</button>
                        <h2 id="anamnese-title">Anamnese</h2>
                        <input type="hidden" id="current-anamnese-client-id">
                    </div>
                    <button class="btn-primary" onclick="Modals.open('nova_anamnese')" style="margin-bottom: 1rem;">+ Nova Avaliação</button>
                    <div id="anamnese-history-list" class="data-list"></div>
                </section>
                <section id="view-servicos" class="view"><div id="servicos-list" class="data-grid"></div></section>
                <section id="view-produtos" class="view"><div id="produtos-list" class="data-grid"></div></section>
                <section id="view-mensagens" class="view"><div id="mensagens-list" class="data-grid"></div></section>
                
                <!-- DASHBOARDS -->
                <section id="view-despesas" class="view">
                    <canvas id="chart-despesas" style="width:100%; max-height:250px; margin-bottom:1rem"></canvas>
                    <div id="despesas-list" class="data-list"></div>
                </section>
                <section id="view-comissao" class="view"><div id="comissao-dashboard"></div></section>
                <section id="view-resumo-financeiro" class="view">
                    <div id="resumo-cards" class="data-grid" style="margin-bottom:1rem"></div>
                    <div class="card" style="margin-bottom:1rem"><h3>Extrato Detalhado</h3><div id="extrato-list" class="data-list" style="margin-top:10px;"></div></div>
                </section>
                <section id="view-performance" class="view">
                    <div id="perf-kpis" class="data-grid" style="margin-bottom:1rem"></div>
                    <canvas id="chart-performance" style="width:100%; max-height:250px; margin-bottom:1rem"></canvas>
                    <div id="performance-ranking" class="data-grid"></div>
                </section>
                <section id="view-configuracoes" class="view">
                    <div class="card">
                        <form onsubmit="Actions.saveSettings(event)">
                            <div class="input-group"><label>Nome do Estúdio</label><input type="text" id="cfg-name" required></div>
                            <div class="input-group"><label>Número Oficial (WhatsApp) p/ Disparos</label><input type="text" id="cfg-phone" placeholder="Ex: 558699999999" required></div>
                            <button class="btn-primary" type="submit">Salvar Alterações</button>
                        </form>
                    </div>
                </section>
            </div>
        </main>

        <nav class="bottom-nav">
            <a href="#" class="b-item active" data-view="agenda"><i class="ph ph-calendar"></i><span>Agenda</span></a>
            <a href="#" class="b-item" data-view="comandas"><i class="ph ph-receipt"></i><span>Comandas</span></a>
            <div class="fab-wrapper"><button class="fab-button" onclick="UI.handleFabClick()"><i class="ph ph-plus"></i></button></div>
            <a href="#" class="b-item" data-view="clientes"><i class="ph ph-users"></i><span>Clientes</span></a>
            <a href="#" class="b-item" onclick="Nav.toggleMenu()"><i class="ph ph-list"></i><span>Menu</span></a>
        </nav>
    </div>

    <div id="modal-container" class="overlay hidden"></div>
    <script src="script.js"></script>
</body>
</html>
