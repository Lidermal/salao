<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Em Manutenção - Amor que Cuida</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #B76E79; --primary-dark: #9a5a63; --bg: #FDFDFD; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Lato', sans-serif; }
        body { 
            background: var(--bg); 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
            padding: 2rem;
            background-image: radial-gradient(#f7e9eb 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .container {
            max-width: 500px;
            background: white;
            padding: 3rem 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(183, 110, 121, 0.15);
            border: 1px solid #f0f0f0;
        }
        .logo-area {
            width: 100px;
            height: 100px;
            background: var(--primary);
            border-radius: 50%;
            margin: 0 auto 2rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
            box-shadow: 0 10px 20px rgba(183, 110, 121, 0.3);
        }
        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--primary-dark);
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        .loader {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .footer {
            margin-top: 3rem;
            font-size: 0.8rem;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-area">
            <!-- Ícone de ferramenta ou logo -->
            <span style="font-size: 2.5rem;">🛠️</span>
        </div>
        <h1>Sistema em Manutenção</h1>
        <p>O <b>Espaço Amor Que Cuida</b> está passando por melhorias técnicas neste momento.<br>Por favor, aguarde enquanto preparamos tudo para você.</p>
        
        <div class="loader"></div>
        
        <div class="footer">
            Equipe Técnica Silven Tec &copy; 2026
        </div>
    </div>
</body>
</html>
